## Timestamp-corrected v2 experiment.
## Use only through scripts/run_timecorrected_entrypoint.py.

project:
  id: paper_002_update_timecorrected_v2
  name: paper_002_update_timecorrected_v2
  title: Fixed KMA interval semantics and symmetric pre-event baselines

research:
  targets: []

data:
  inp_path: "inp_versions/seocho_imperv_landcover_strict.inp"
  ensemble_dir: "results/swmm_timecorrected_v2_with_lead"
  catalog_path: "data/event_catalog.json"
  rain_dir: "data/rainfall_timecorrected_v2"
  swmm_output_dir: "results/swmm_timecorrected_v2_with_lead"
  rainfall_timestamp_shift_minutes: 0
  source_rainfall_timestamp_shift_minutes: -60
  report_lead_steps: 6
  n_sets: 50

experiment:
  loop: 124
  ensemble_size: 5
  conformal_alpha: 0.10
  lambda_cont: 0.1
  alpha_peak: 0.0
  use_nse_loss: false
  use_cont_loss: true
  hidden_dim: 128
  n_heads: 4
  n_layers: 4
  lr: 5.0e-4
  weight_decay: 1.0e-4
  use_cosine_wr: false
  cosine_T0: 50
  scalar_rain_decoder: false
  dropout: 0.0
  temporal_decoder: false
  batch_size: 1
  epochs: 200
  patience: 50
  n_swmm_ensemble: 50
  T_out: 100
  T_rain: 72
  wall_time_limit_s: 21600

protocol:
  id: paper002_timecorrected_v2
  fixed_rainfall_shift_minutes: -60
  event_specific_lag_optimisation: false
  symmetric_baseline: true
  legacy_outputs_preserved: true

pipeline:
  current_phase: corrected_v2_recalculation
